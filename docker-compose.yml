# Qdrant server pinned to the same minor version as the locked qdrant-client (1.20).
# Start: docker compose up -d   Dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_server:/qdrant/storage
